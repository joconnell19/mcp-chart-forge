<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1600px;height:400px;overflow:hidden}
body{font-family:'Outfit',sans-serif;background:linear-gradient(120deg,#C8DAE4 0%,#D4C5E2 55%,#E8D5F0 100%);position:relative}
.glow{position:absolute;border-radius:50%}
.g1{width:520px;height:520px;right:-80px;top:-160px;background:radial-gradient(circle,rgba(139,107,174,.35),rgba(139,107,174,0) 65%)}
.g2{width:420px;height:420px;left:520px;bottom:-240px;background:radial-gradient(circle,rgba(94,127,142,.25),rgba(94,127,142,0) 65%)}
.wrap{position:absolute;left:110px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
img.logo{height:86px;margin-bottom:26px;align-self:flex-start}
.k{font-size:24px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:#8B6BAE;margin:0 0 10px}
h1{font-size:64px;font-weight:700;letter-spacing:-.02em;color:#3F5A67;margin:0;line-height:1}
img.bf{position:absolute;right:150px;top:80px;height:240px;opacity:.9}
</style></head><body>
<div class="glow g1"></div><div class="glow g2"></div>
<div class="wrap"><img class="logo" src="assets/logo.png" alt=""><p class="k">Anonymous staff survey</p><h1>Production incentives</h1></div>
<img class="bf" src="assets/butterfly.png" alt="">
</body></html>
